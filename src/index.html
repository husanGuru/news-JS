<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <h1>News Portal</h1>
        </header>
        <main>
            <div class="sources buttons"></div>
            <div class="news"></div>
        </main>
        <footer>
            <p class="copyright">
                Copyright <a href="https://newsapi.org" target="_blank" rel="noopener noreferrer">NewsAPI</a>
            </p>
            <div class="footer__meta">
                <a
                    class="footer__github"
                    href="https://github.com/husanGuru"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Author's GitHub profile"
                >
                    <svg class="footer__github-icon" viewBox="0 0 16 16" width="20" height="20" aria-hidden="true">
                        <path
                            fill="currentColor"
                            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
                            1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
                            0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4
                            0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0
                            3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01
                            8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
                        />
                    </svg>
                    <span>GitHub</span>
                </a>
                <span class="footer__year">© 2026</span>
                <a
                    class="footer__course"
                    href="https://rs.school/courses"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="RS School courses"
                >
                    <svg
                        class="footer__course-logo"
                        viewBox="0 0 120 32"
                        width="90"
                        height="24"
                        role="img"
                        aria-label="RS School"
                    >
                        <rect width="118" height="30" x="1" y="1" rx="6" fill="#17181c" stroke="#30c5ff" stroke-width="2" />
                        <text
                            x="60"
                            y="21"
                            text-anchor="middle"
                            font-family="Arial, sans-serif"
                            font-size="13"
                            font-weight="700"
                            fill="#70d6ff"
                        >
                            RS School
                        </text>
                    </svg>
                </a>
            </div>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
